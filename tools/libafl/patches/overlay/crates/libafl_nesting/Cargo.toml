[package]
name = "libafl_nesting"
version.workspace = true
authors = ["Qiang Liu <cyruscyliu@gmail.com>"]
description = "Structured nested fuzzing support for LibAFL"
repository = "https://github.com/AFLplusplus/LibAFL/"
edition = "2024"
license.workspace = true
readme = "./README.md"
keywords = ["fuzzing", "testing", "security", "nested-virtualization"]
categories = ["development-tools::testing", "os"]

[features]
default = ["std"]
std = ["libafl_bolts/std", "libafl/std"]
qemu-bridge-aarch64 = [
  "std",
  "dep:libafl_qemu",
  "libafl_qemu/aarch64",
  "libafl_qemu/shared",
  "libafl_qemu/systemmode"
]

[dependencies]
libafl = { workspace = true, default-features = false }
libafl_bolts = { workspace = true, default-features = false }
libafl_qemu = { workspace = true, default-features = false, optional = true }
libvharness_sys = { workspace = true, features = ["aarch64"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
flate2 = "1"

[dev-dependencies]
static_assertions = { workspace = true }

[[bin]]
name = "libafl_nesting_stub"
path = "src/bin/libafl_nesting_stub.rs"
# The Rust guest stub links the qemu-bridge C symbols (lqprintf and the
# libafl_qemu entry points), which are provided by the bridge shared
# library; without that feature the binary cannot link on the host.
required-features = ["qemu-bridge-aarch64"]

[lints]
workspace = true
